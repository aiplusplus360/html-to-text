[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html-to-text"
version = "0.1.0"
description = "Extract main content from HTML and render clean Markdown from the standard library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["html", "markdown", "extraction", "scraping", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/html-to-text"

[project.scripts]
html-to-text = "htmltotext.cli:main"

[tool.setuptools.packages.find]
include = ["htmltotext*"]
